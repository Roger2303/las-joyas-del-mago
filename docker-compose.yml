version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: joyas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./server
    restart: always
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=joyas
      - JWT_SECRET=supersecreto
      - NODE_ENV=production
      - PORT=9000
      - DEBUG_URL=/debug
    ports:
      - "9000:9000"

  # frontend:
  #   build: ./client
  #   restart: always
  #   depends_on:
  #     - backend
  #   ports:
  #     - "8080:80"

volumes:
  db_data:
